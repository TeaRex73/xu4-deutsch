# Pinned third-party dependencies for the macOS build.
#
# Sourced by apple-stuff/build-deps.sh.  The URLs and checksums belong
# together: update both when a pin is moved, then verify the resulting
# dmg on 10.13 (x86_64) and 11+ (arm64).
#
# SDL_mixer 1.2 has no release after 1.2.12 and upstream has no CMake
# build for it.  This commit is the tip of the maintained SDL-1.2
# branch (version 1.2.13-dev); apple-stuff/deps/sdl_mixer/CMakeLists.txt
# provides the build description.

