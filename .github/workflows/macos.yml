name: MACOS
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # arm64 runner; both slices are cross-compiled against the same SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Retrieve Git Hash
        id: git-hash
        run: echo "hash=$(git rev-parse --short HEAD)" \
            >> "$GITHUB_OUTPUT"
      - name: Select SDK
        id: xcode
        run: |
          echo "sdk=$(xcrun --sdk macosx --show-sdk-path)" \
              >> "$GITHUB_OUTPUT"
          echo "version=$(xcodebuild -version | head -1 | tr -d ' ')" \
              >> "$GITHUB_OUTPUT"
          echo "SDK=$(xcrun --sdk macosx --show-sdk-path)" \
              >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: apple-stuff/build/deps/prefix
          key: >-
            macos-deps-v1-${{ steps.xcode.outputs.version }}-${{
            hashFiles('apple-stuff/deps/**',
            'apple-stuff/build-deps.sh') }}
      - name: Build dependencies
        run: apple-stuff/build-deps.sh
      - name: Install dmg tool
        run: brew install create-dmg
      - name: Build app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: apple-stuff/build-app.sh
      - name: Verify app
        run: |
          app="apple-stuff/source_folder/Ultima IV Deutsch.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/u4"
          test -f "$app/Contents/Resources/mirrors.txt"
          ls "apple-stuff/source_folder/Ultima IV Dokumentation"/*.pdf.xor \
              >/dev/null
          cp -R "$app" "$RUNNER_TEMP/"
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" \
              "$RUNNER_TEMP/Ultima IV Deutsch.app/Contents/MacOS/u4" \
              --help >/dev/null
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: ultima4-deutsch-macos-${{ steps.git-hash.outputs.hash }}
          path: |
            apple-stuff/out/*.dmg
            apple-stuff/out/*.dSYM.zip
          # The dmg and dSYM zip are already compressed.
          compression-level: 0
